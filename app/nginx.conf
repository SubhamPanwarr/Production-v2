server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# The exporter sidecar shares the Pod network namespace and reads this endpoint
# over loopback. It is not exposed by the Kubernetes Service.
server {
    listen 8080;
    server_name _;

    location = /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }
}
