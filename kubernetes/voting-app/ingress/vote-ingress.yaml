apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vote-ingress
  namespace: voting-app
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/load-balancer-name: production-vote-alb

    alb.ingress.kubernetes.io/actions.vote-weighted: |
      {
        "type": "forward",
        "forwardConfig": {
          "targetGroups": [
            {
              "serviceName": "vote",
              "servicePort": "80",
              "weight": 100
            },
            {
              "serviceName": "vote-canary",
              "servicePort": "80",
              "weight": 0
            }
          ]
        }
      }

spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vote-weighted
                port:
                  name: use-annotation
