apiVersion: apps/v1
kind: Deployment

metadata:
  name: vote-green
  namespace: voting-app

spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: vote
      slot: green

  template:
    metadata:
      labels:
        app: vote
        slot: green
        version: green

    spec:
      tolerations:
        - key: dedicated
          operator: Equal
          value: frontend
          effect: NoSchedule

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: vote
              slot: green

      containers:
        - name: vote
          image: 523881172609.dkr.ecr.us-east-1.amazonaws.com/production-app:vote-v2
          imagePullPolicy: IfNotPresent

          env:
            - name: OPTION_A
              value: "GREEN - Cats"
            - name: OPTION_B
              value: "GREEN - Dogs"

          ports:
            - containerPort: 80
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
