apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-observer
  namespace: production
  labels:
    app: node-observer
spec:
  selector:
    matchLabels:
      app: node-observer
  template:
    metadata:
      labels:
        app: node-observer
    spec:
      tolerations:
        - key: dedicated
          operator: Equal
          value: frontend
          effect: NoSchedule
      containers:
        - name: node-observer
          image: busybox:1.36
          command:
            - sh
            - -c
            - while true; do echo "Node observer running on $(hostname)"; sleep 60; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
