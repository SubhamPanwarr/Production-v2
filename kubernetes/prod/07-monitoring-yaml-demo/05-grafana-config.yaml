apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-yaml-provisioning
  namespace: monitoring-yaml
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus YAML Demo
        uid: prometheus-yaml
        type: prometheus
        access: proxy
        url: http://prometheus-yaml.monitoring-yaml.svc.cluster.local:9090
        isDefault: true
        editable: true
  dashboard-provider.yaml: |
    apiVersion: 1
    providers:
      - name: YAML Demo
        orgId: 1
        folder: YAML Demo
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards
  nginx-dashboard.json: |
    {
      "id": null,
      "uid": "nginx-yaml-demo",
      "title": "NGINX Metrics - YAML Demo",
      "tags": ["nginx", "prometheus", "yaml-demo"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Active NGINX connections",
          "datasource": {"type": "prometheus", "uid": "prometheus-yaml"},
          "targets": [
            {
              "refId": "A",
              "expr": "nginx_connections_active{namespace=\"production\",service=\"nginx-service\"}",
              "legendFormat": "{{pod}}",
              "range": true
            }
          ],
          "gridPos": {"h": 9, "w": 24, "x": 0, "y": 0},
          "fieldConfig": {
            "defaults": {"unit": "short", "min": 0},
            "overrides": []
          },
          "options": {
            "legend": {"displayMode": "list", "placement": "bottom"},
            "tooltip": {"mode": "multi", "sort": "none"}
          }
        }
      ]
    }
