apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-yaml-data
  namespace: monitoring-yaml
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ebs-gp3
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-yaml
  namespace: monitoring-yaml
  labels:
    app: grafana-yaml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-yaml
  template:
    metadata:
      labels:
        app: grafana-yaml
    spec:
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:12.1.1
          ports:
            - name: web
              containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: web
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: web
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yaml
              subPath: datasource.yaml
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/provider.yaml
              subPath: dashboard-provider.yaml
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/nginx-dashboard.json
              subPath: nginx-dashboard.json
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-yaml-data
        - name: provisioning
          configMap:
            name: grafana-yaml-provisioning
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-yaml
  namespace: monitoring-yaml
spec:
  type: ClusterIP
  selector:
    app: grafana-yaml
  ports:
    - name: web
      port: 3000
      targetPort: web
