apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-yaml-data
  namespace: monitoring-yaml
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ebs-gp3
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-yaml
  namespace: monitoring-yaml
  labels:
    app: prometheus-yaml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-yaml
  template:
    metadata:
      labels:
        app: prometheus-yaml
    spec:
      serviceAccountName: prometheus-yaml
      securityContext:
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --web.enable-lifecycle
          ports:
            - name: web
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: web
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-yaml-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-yaml-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-yaml
  namespace: monitoring-yaml
spec:
  type: ClusterIP
  selector:
    app: prometheus-yaml
  ports:
    - name: web
      port: 9090
      targetPort: web
