apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-java-deployer
  namespace: production-v3
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["java-login-app"]
    verbs: ["get", "patch", "update", "watch"]

  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-java-deployer-binding
  namespace: production-v3
subjects:
  - kind: Group
    name: production-v3-deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: jenkins-java-deployer
  apiGroup: rbac.authorization.k8s.io
